<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六级模拟卷</title>
<meta name="description" content="从题库随机组一份完整的六级模拟试卷，A4 排版，可打印或存为 PDF。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@600;800&display=swap">
<style>
  :root{--ink:#111;--dim:#666;--line:#bbb;--brand:#4f46e5}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e8f0;color:var(--ink);font-family:"Lora","Noto Sans SC",Georgia,serif;font-size:11.5pt;line-height:1.55}
  /* 工具条：只在屏幕上显示 */
  .bar{position:sticky;top:0;z-index:9;background:#1b1a2e;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:"Manrope","Noto Sans SC",sans-serif;font-size:13.5px}
  .bar b{font-weight:800;margin-right:auto}
  .bar button,.bar a{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:7px 13px;cursor:pointer;text-decoration:none;font-weight:700;display:inline-flex;gap:6px;align-items:center}
  .bar button.p{background:#fff;color:#1b1a2e;border-color:#fff}
  .bar label{display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
  .bar code{background:rgba(255,255,255,.12);padding:2px 7px;border-radius:6px;font-size:12px}
  /* A4 页面 */
  .page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:18mm 18mm 16mm;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .pn{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:9pt;color:var(--dim);font-family:"Manrope",sans-serif}
  h1{font-family:"Noto Sans SC",sans-serif;font-size:17pt;text-align:center;margin:0 0 2mm;letter-spacing:.04em}
  .sub{text-align:center;font-size:10pt;color:var(--dim);margin-bottom:6mm;font-family:"Noto Sans SC",sans-serif}
  .info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;border:1px solid var(--line);padding:3mm 4mm;margin-bottom:6mm;font-family:"Noto Sans SC",sans-serif;font-size:10pt}
  .info span{border-bottom:1px solid var(--line);padding-bottom:1mm}
  h2{font-family:"Noto Sans SC",sans-serif;font-size:13pt;margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:2px solid var(--ink);letter-spacing:.02em}
  h2 small{font-weight:400;font-size:9.5pt;color:var(--dim);margin-left:8px}
  h3{font-family:"Noto Sans SC",sans-serif;font-size:11pt;margin:5mm 0 1.5mm}
  .dir{font-style:italic;color:#333;margin:0 0 3mm;font-size:10.5pt}
  .lines{height:140mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 8.5mm,var(--line) 8.5mm,var(--line) calc(8.5mm + 1px));margin-top:3mm}
  .lines.short{height:95mm}
  ol.q{margin:0;padding:0;list-style:none}
  ol.q li{margin:0 0 2.6mm;page-break-inside:avoid;break-inside:avoid}
  ol.q .stem{font-weight:600}
  ol.q .stem.n::before{content:attr(data-n) ". ";font-family:"Manrope",sans-serif;font-weight:800}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm;margin:1mm 0 0 5mm}
  .opts div{padding:.4mm 0}
  .opts.one{grid-template-columns:1fr}
  .passage p{margin:0 0 2.2mm;text-align:justify}
  .passage .pl{font-family:"Manrope",sans-serif;font-weight:800;margin-right:2mm}
  .blank{display:inline-block;min-width:14mm;border-bottom:1px solid var(--ink);text-align:center;font-family:"Manrope",sans-serif;font-size:9pt;vertical-align:bottom;margin:0 1mm}
  .bank{border:1px solid var(--line);padding:2.5mm 3mm;margin:2mm 0 3mm;display:grid;grid-template-columns:repeat(3,1fr);gap:1mm 4mm;font-family:"Manrope","Noto Sans SC",sans-serif;font-size:10pt}
  .zh{font-family:"Noto Sans SC",sans-serif;line-height:1.9;text-indent:2em}
  .lect{margin:3mm 0 2mm;font-size:10.5pt;color:var(--dim);font-family:"Noto Sans SC",sans-serif}
  .key{columns:2;column-gap:8mm;font-family:"Manrope","Noto Sans SC",sans-serif;font-size:10.5pt}
  .key div{break-inside:avoid;margin-bottom:1mm}
  .exp{font-family:"Noto Sans SC",sans-serif;font-size:9.5pt;color:#333;margin:0 0 2mm}
  .script{white-space:pre-line;font-size:10.5pt;margin:0 0 4mm}
  .sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm 6mm;font-family:"Manrope",sans-serif;font-size:10pt}
  .sheet.wide{grid-template-columns:1fr}
  .sheet .no{width:7mm;text-align:right;font-weight:800}
  .sheet .bub{flex-wrap:nowrap}
  .sheet+h3,h3{break-after:avoid;page-break-after:avoid}
  .sheet{break-inside:auto}
  .sheet>div{break-inside:avoid}
  .sheet div{display:flex;gap:2mm;align-items:center}
  .sheet .bub{display:inline-flex;gap:1.5mm}
  .sheet .bub i{width:5mm;height:3.4mm;border:1px solid var(--ink);border-radius:2mm;font-style:normal;font-size:7pt;display:grid;place-items:center}
  .hide{display:none}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar{display:none}
    .page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:18mm 18mm 16mm}
    a{color:inherit;text-decoration:none}
  }
  @media (max-width:760px){
    body{font-size:10.5pt}
    .page{width:auto;min-height:auto;margin:10px;padding:8mm 6mm}
    .info{grid-template-columns:1fr}
    .opts{grid-template-columns:1fr}
    .key{columns:1}
    .sheet{grid-template-columns:repeat(2,1fr)}
    .sheet.wide{grid-template-columns:1fr}
    .sheet .bub{flex-wrap:wrap;row-gap:1.5mm}
    .bar b{width:100%}
  }
</style>
</head>
<body>
<div class="bar">
  <b>六级模拟卷</b>
  <span>卷号 <code id="seedLab"></code></span>
  <label><input type="checkbox" id="withKey" checked> 附答案与听力原文</label>
  <label><input type="checkbox" id="withSheet" checked> 附答题卡</label>
  <button id="regen">换一套</button>
  <button class="p" id="print">打印 / 存 PDF</button>
  <a href="index.html">返回主站</a>
</div>
<div id="paper"></div>
<script src="assets/data-practice.js?v=6"></script>
<script src="assets/data-listening-2.js?v=6"></script>
<script src="assets/data-reading-2.js?v=6"></script>
<script src="assets/data-writing-2.js?v=6"></script>
<script src="assets/paper.js?v=6"></script>
</body>
</html>
