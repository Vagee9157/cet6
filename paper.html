<head>
<meta charset="utf-8">

<title>六级模拟卷</title>
<meta name="description" content="从题库随机组一份完整的六级模拟试卷：仿真题试题册 + 答题卡 1 / 2 + 教师用答案页，A4 排版，可打印或存为 PDF。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">

<body>
<div class="bar">
  <b>六级模拟卷</b>
  <span>卷号 <code id="seedLab"></code></span>
  <label><input type="checkbox" id="withSheet" checked> 附答题卡</label>
  <label><input type="checkbox" id="withKey" checked> 附答案<span class="lg">与听力原文（教师用）</span></label>
  <label><input type="checkbox" id="withStem"> 听力印题干</label>
  <label title="各题型先从没交过卷 / 没写过的题里抽，不够再补；同一卷号以后按记录还原"><input type="checkbox" id="fresh" checked> 优先抽没做过的</label>
  <button id="regen">换一套</button>
  <button class="p" id="print">打印 / 存 PDF</button>
  <a id="online" href="index.html#exam">在线做这套</a>
  <a href="index.html">返回主站</a>
  <span class="st" id="stat"></span>
</div>
